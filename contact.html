    :root{
      --blue:#0ea5e9;
      --dark:#0b0b0b;
      --accent:#0369a1;
      --nav-bg:#0ea5e9;

    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,Arial,sans-serif;background:#f8fbff;color:#012;line-height:1.6}

   /* ---------- TOP NAV ---------- */
    header.site-header{position:sticky;top:0;z-index:1200;background:var(--nav-bg);backdrop-filter:blur(6px);border-bottom:1px solid rgba(14, 12, 12, 0.781)}
    .nav-inner{max-width:var(--max-width);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:12px}

    /* Left: nav links (desktop) */
    .nav-left{display:flex;gap:12px;align-items:center}
    .nav-left a{color:(black);text-decoration:none;padding:8px 10px;border-radius:8px;font-weight:600;transition:all .22s ease}
    .nav-left a:hover{background:linear-gradient(90deg,rgba(255, 252, 252, 0.76),rgba(26, 191, 241, 0.486));transform:translateY(-3px);box-shadow:0 8px 18px rgba(3,105,161,0.06)}

    /* Center: brand */
    .brand{display:flex;align-items:center;gap:10px;color:#fff}
    .brand .logo{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--accent));display:flex;align-items:center;justify-content:center;}
    .brand .text{line-height:1}
    .brand .name{font-size:16px;font-weight:800}
    .brand .sub{font-size:12px;opacity:0.9}
    .logo-img {width: 45px; height: 45px;border-radius: 8px;object-fit: cover;}

    /* Right: phone */
    .nav-right{display:flex;align-items:center;gap:10px}
    .phone-btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--blue),var(--accent));color:#fff;padding:10px 12px;border-radius:999px;border:0;font-weight:700;cursor:pointer}
    .phone-btn svg{flex:0 0 18px}
    .phone-tip{position:relative;font-size:13px;color:#dff6ff;min-width:60px;text-align:center}
    .phone-copied{animation:copiedAnim .9s ease forwards}
    @keyframes copiedAnim{0%{opacity:0;transform:translateY(6px)}30%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}

    /* Hamburger for small screens */
    .hamburger{display:none;width:44px;height:44px;border-radius:8px;background:transparent;align-items:center;justify-content:center;border:0;cursor:pointer}
    .hamburger .bar{width:20px;height:2px;background:#fff;border-radius:2px;display:block;position:relative;transition:all .25s}
    .hamburger .bar::before,.hamburger .bar::after{content:'';position:absolute;left:0;width:20px;height:2px;background:#fff;border-radius:2px;transition:all .25s}
    .hamburger .bar::before{top:-6px}
    .hamburger .bar::after{top:6px}
    .hamburger.open .bar{background:transparent}
    .hamburger.open .bar::before{transform:translateY(6px) rotate(45deg)}
    .hamburger.open .bar::after{transform:translateY(-6px) rotate(-45deg)}

    /* Mobile nav drawer */
    .mobile-drawer{display:none;position:fixed;inset:0;z-index:1150;background:linear-gradient(180deg,rgba(0,0,0,0.45),rgba(0,0,0,0.6));}
    .mobile-drawer .panel{position:absolute;left:0;top:0;width:280px;height:100%;background:linear-gradient(180deg,var(--nav-bg),#03101a);padding:20px;display:flex;flex-direction:column;gap:12px}
    .mobile-drawer a{color: beige;text-decoration:none;padding:10px;border-radius:8px;font-weight:700}

    /* ===== CONTACT SECTION ===== */
    .contact-section{
      max-width:var(--max-width);
      margin:60px auto;
      background:#fff;
      box-shadow:0 8px 18px rgba(3,105,161,0.08);
      border-radius:12px;
      padding:40px;
    }
    .contact-header{text-align:center;margin-bottom:40px}
    .contact-header h1{font-size:2em;color:var(--dark)}
    .contact-header p{color:#555}
    .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
    .contact-info{
      background:linear-gradient(135deg,var(--blue),var(--accent));
      color:#fff;
      border-radius:12px;
      padding:30px;
    }
    .contact-info h2{margin-bottom:15px}
    .contact-info p{margin-bottom:10px}
    .contact-form form{display:flex;flex-direction:column;gap:15px}
    .contact-form input,.contact-form textarea{
      padding:12px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:1em;
      width:100%;
    }
    .contact-form button{
      background:linear-gradient(90deg,var(--blue),var(--accent));
      color:#fff;
      padding:12px;
      border:none;
      border-radius:8px;
      font-size:1em;
      font-weight:600;
      cursor:pointer;
      transition:background .3s;
    }
    .contact-form button:hover{opacity:.9}

    /* ===== RESPONSIVE ===== */
    @media(max-width:780px){
      .nav-left{display:none}
      .hamburger{display:block}
      .contact-grid{grid-template-columns:1fr}
    }

    footer{background:#03101a;color:#fff;text-align:center;padding:30px 20px;margin-top:60px}
